<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "El Messiri", sans-serif; background-color: #f0f8ff; padding: 40px; }
    h1 { text-align: center; color: #004080; }
    form {
      background: #ffffff;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    textarea { height: 120px; }
    button {
      margin-top: 20px;
      background-color: #004080;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
    }
    button:hover {
      background-color: #0066cc;
    }
    .nav {
      text-align: center;
      margin-top: 30px;
    }
    .nav a {
      color: #004080;
      text-decoration: none;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <h1>Contact Form</h1>
  <form action="#">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send</button>
  </form>

  <div class="nav">
    <a href="index.html">Home</a> | 
    <a href="platforms.html">Platforms</a>
  </div>
</body>
</html>
